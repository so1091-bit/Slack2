<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>일과관련된 대화</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --side: #3f0e40;
        --side-hover: #350d36;
        --side-active: #1164a3;
        --side-text: #cfc3cf;
        --side-head: #fff;
        --top: #350d36;
        --bg: #fff;
        --text: #1d1c1d;
        --muted: #616061;
        --line: #e8e8e8;
        --hover: #f8f8f8;
        --accent: #007a5a;
        --link: #1264a3;
        --online: #2bac76;
        --badge: #cd2553;
        --mention-bg: #fff7e0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Lato, "Noto Sans KR", system-ui, sans-serif;
        font-size: 15px;
        color: var(--text);
        background: var(--bg);
        display: grid;
        grid-template-rows: 44px 1fr;
        overflow: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
      }

      /* 상단바 */
      .top {
        background: var(--top);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
      }
      .top .ws {
        font-weight: 900;
        font-size: 16px;
      }
      .top .menu {
        display: none;
        background: none;
        border: 0;
        color: #fff;
        font-size: 20px;
        padding: 4px;
      }
      .top .me {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .top .me button {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
      }
      .top .me button:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 0;
      }

      /* 사이드바 */
      .side {
        background: var(--side);
        color: var(--side-text);
        overflow-y: auto;
        padding: 12px 0;
      }
      .side h3 {
        color: var(--side-text);
        font-size: 14px;
        font-weight: 400;
        margin: 14px 16px 4px;
        opacity: 0.85;
      }
      .side .item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: calc(100% - 16px);
        margin: 0 8px;
        padding: 5px 12px;
        background: none;
        border: 0;
        border-radius: 6px;
        color: var(--side-text);
        text-align: left;
        font-size: 15px;
      }
      .side .item:hover {
        background: var(--side-hover);
      }
      .side .item.on {
        background: var(--side-active);
        color: #fff;
      }
      .side .item.unread {
        color: #fff;
        font-weight: 900;
      }
      .side .item .hash {
        opacity: 0.7;
        width: 14px;
        text-align: center;
      }
      .side .item .badge {
        margin-left: auto;
        background: var(--badge);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        border-radius: 9px;
        padding: 1px 7px;
      }
      .side .member {
        cursor: default;
      }
      .side .member:hover {
        background: none;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1.5px solid var(--side-text);
        flex: none;
      }
      .dot.on {
        background: var(--online);
        border-color: var(--online);
      }
      .side .member .you {
        opacity: 0.6;
        font-size: 13px;
      }

      /* 메인 */
      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 0;
        min-width: 0;
      }
      .head {
        border-bottom: 1px solid var(--line);
        padding: 12px 20px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .head h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 900;
        white-space: nowrap;
      }
      .head .desc {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .msgs {
        overflow-y: auto;
        padding: 8px 0 12px;
      }
      .empty {
        color: var(--muted);
        padding: 40px 20px;
        text-align: center;
      }
      .day {
        display: flex;
        align-items: center;
        margin: 16px 0 6px;
      }
      .day::before,
      .day::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .day span {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 2px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .msg {
        display: grid;
        grid-template-columns: 36px 1fr;
        column-gap: 8px;
        padding: 4px 20px;
        position: relative;
      }
      .msg:hover {
        background: var(--hover);
      }
      .msg.cont {
        padding-top: 1px;
        padding-bottom: 1px;
      }
      .msg.mention {
        background: var(--mention-bg);
      }
      .av {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        display: grid;
        place-items: center;
        margin-top: 3px;
        user-select: none;
      }
      .msg .meta {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .msg .who {
        font-weight: 900;
      }
      .msg .time {
        color: var(--muted);
        font-size: 12px;
      }
      .msg .gutter-time {
        color: var(--muted);
        font-size: 11px;
        text-align: right;
        padding-top: 3px;
        visibility: hidden;
      }
      .msg.cont:hover .gutter-time {
        visibility: visible;
      }
      .msg .text {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.46;
      }
      .msg .text a {
        color: var(--link);
      }
      .msg .text .at {
        background: #e8f5fa;
        color: var(--link);
        border-radius: 3px;
        padding: 0 2px;
      }
      .msg.pending .text {
        color: var(--muted);
      }

      .reacts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      .reacts button {
        border: 1px solid var(--line);
        background: #f2f2f2;
        border-radius: 12px;
        padding: 1px 8px;
        font-size: 13px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .reacts button.mine {
        border-color: var(--link);
        background: #e8f5fa;
        color: var(--link);
      }

      .tools {
        position: absolute;
        right: 20px;
        top: -14px;
        display: none;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        padding: 2px;
      }
      .msg:hover .tools,
      .tools.open {
        display: flex;
      }
      .tools button {
        background: none;
        border: 0;
        border-radius: 6px;
        padding: 3px 6px;
        font-size: 15px;
      }
      .tools button:hover {
        background: #f2f2f2;
      }

      /* 입력창 */
      .composer {
        padding: 0 20px 6px;
      }
      .box {
        border: 1px solid #bbb;
        border-radius: 8px;
        overflow: hidden;
      }
      .box:focus-within {
        border-color: #868686;
        box-shadow: 0 0 0 1px #868686;
      }
      .box textarea {
        display: block;
        width: 100%;
        border: 0;
        outline: 0;
        resize: none;
        font: inherit;
        padding: 10px 12px 4px;
        max-height: 200px;
        min-height: 42px;
      }
      .box .bar {
        display: flex;
        align-items: center;
        padding: 4px 8px 6px;
        gap: 4px;
      }
      .box .bar .hint {
        color: var(--muted);
        font-size: 11px;
        margin-right: auto;
        padding-left: 4px;
      }
      .box .send {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 4px;
        padding: 4px 12px;
        font-weight: 700;
      }
      .box .send:disabled {
        background: #ddd;
        color: #999;
        cursor: default;
      }
      .typing {
        height: 18px;
        font-size: 12px;
        color: var(--muted);
        padding: 2px 2px 0;
      }

      /* 이름 다이얼로그 */
      dialog {
        border: 0;
        border-radius: 10px;
        padding: 24px;
        width: min(380px, calc(100vw - 32px));
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      dialog h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      dialog p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 14px;
      }
      dialog input {
        width: 100%;
        font: inherit;
        padding: 9px 11px;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
      dialog .err {
        color: var(--badge);
        font-size: 13px;
        min-height: 18px;
        margin: 6px 0;
      }
      dialog .row {
        display: flex;
        justify-content: flex-end;
      }
      dialog button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 8px 16px;
        font-weight: 700;
      }

      .emoji-pop {
        position: fixed;
        z-index: 10;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        padding: 6px;
        display: grid;
        grid-template-columns: repeat(6, 32px);
        gap: 2px;
      }
      .emoji-pop button {
        background: none;
        border: 0;
        border-radius: 6px;
        font-size: 18px;
        height: 32px;
      }
      .emoji-pop button:hover {
        background: #f2f2f2;
      }

      @media (max-width: 720px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          top: 44px;
          bottom: 0;
          left: 0;
          width: 260px;
          z-index: 5;
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        body.nav .side {
          transform: none;
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }
        .top .menu {
          display: block;
        }
        .head,
        .msg,
        .composer {
          padding-left: 16px;
          padding-right: 16px;
        }
        .box .bar .hint {
          display: none;
        }
        .tools {
          right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="메뉴">☰</button>
      <span class="ws">CTDD_Tech</span>
      <div class="me">
        <span id="meName">접속 중…</span
        ><button id="renameBtn" hidden>이름 변경</button>
      </div>
    </header>

    <div class="app">
      <nav class="side">
        <h3>채널</h3>
        <div id="chanList"></div>
        <h3>멤버</h3>
        <div id="memberList"></div>
      </nav>

      <main class="main">
        <div class="head">
          <h2 id="chanTitle"># 일반</h2>
          <span class="desc" id="chanDesc"></span>
        </div>
        <div class="msgs" id="msgs"><div class="empty">불러오는 중…</div></div>
        <div class="composer">
          <form class="box" id="sendForm">
            <textarea
              id="input"
              rows="1"
              placeholder="메시지 보내기"
              maxlength="2000"
              disabled
            ></textarea>
            <div class="bar">
              <span class="hint"
                ><b>Enter</b> 전송 · <b>Shift+Enter</b> 줄바꿈 ·
                <b>@이름</b> 멘션</span
              >
              <button class="send" id="sendBtn" disabled>전송</button>
            </div>
          </form>
          <div class="typing" id="typing"></div>
        </div>
      </main>
    </div>

    <dialog id="nameDlg">
      <form id="nameForm">
        <h2>이름을 알려주세요</h2>
        <p>채팅에 표시될 이름이에요. 나중에 바꿀 수 있어요.</p>
        <input
          id="nameInput"
          maxlength="20"
          autocomplete="off"
          placeholder="예: 성훈"
        />
        <div class="err" id="nameErr"></div>
        <div class="row"><button>시작하기</button></div>
      </form>
    </dialog>

    <script type="module">
      const BASE_TITLE = document.title;
      // 채널 목록을 바꾸면 firestore.rules 의 채널 목록도 같이 바꿔야 함
      const CHANNELS = [
        { id: "general", name: "일반", desc: "아무 얘기나" },
        { id: "lunch", name: "점심", desc: "오늘 뭐 먹지" },
        { id: "random", name: "잡담", desc: "링크, 짤, 기타 등등" },
      ];
      const EMOJIS = [
        "👍",
        "❤️",
        "😂",
        "😮",
        "😢",
        "🎉",
        "🙏",
        "👀",
        "🔥",
        "✅",
        "💯",
        "🍜",
      ];
      const ONLINE_MS = 75_000; // lastSeen 이 이 시간 안이면 온라인
      const TYPING_MS = 6_000;
      const HISTORY = 300; // 채널당 불러올 최근 메시지 수

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      let me = null; // { uid, name }
      let current = localStorage.getItem("chan") || "general";
      if (!CHANNELS.some((c) => c.id === current)) current = "general";
      const users = {}; // uid -> { name, lastSeen(ms), typing: { cid, at(ms) } }
      const messages = {}; // cid -> [ { id, uid, text, createdAt(ms|null), reactions } ]
      const lastRead = JSON.parse(localStorage.getItem("lastRead") || "{}");
      let skew = 0; // 서버 시간 - 로컬 시간 (대략)

      // ---- 표시 도우미 ----
      const COLORS = [
        "#e8912d",
        "#2eb67d",
        "#36c5f0",
        "#e01e5a",
        "#4a154b",
        "#1264a3",
        "#7c3085",
        "#d4a017",
      ];
      function color(uid) {
        let h = 0;
        for (const ch of uid) h = (h * 31 + ch.charCodeAt(0)) | 0;
        return COLORS[Math.abs(h) % COLORS.length];
      }
      const nameOf = (uid) => users[uid]?.name || "(알 수 없음)";
      const now = () => Date.now() + skew;
      const isOnline = (uid) =>
        uid === me?.uid || now() - (users[uid]?.lastSeen ?? 0) < ONLINE_MS;
      const fmtTime = (ms) =>
        new Date(ms).toLocaleTimeString("ko-KR", {
          hour: "numeric",
          minute: "2-digit",
        });
      function fmtDay(ms) {
        const d = new Date(ms),
          t = new Date();
        const y = new Date();
        y.setDate(t.getDate() - 1);
        if (d.toDateString() === t.toDateString()) return "오늘";
        if (d.toDateString() === y.toDateString()) return "어제";
        return d.toLocaleDateString("ko-KR", {
          month: "long",
          day: "numeric",
          weekday: "long",
        });
      }
      function fmtText(text) {
        let html = esc(text).replace(
          /https?:\/\/[^\s<]+/g,
          (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`,
        );
        const names = Object.values(users)
          .map((u) => u.name)
          .filter(Boolean)
          .sort((a, b) => b.length - a.length);
        for (const n of names)
          html = html
            .split("@" + esc(n))
            .join(`<span class="at">@${esc(n)}</span>`);
        return html;
      }
      const mentionsMe = (text) => me?.name && text.includes("@" + me.name);

      // ---- 사이드바 ----
      function unreadCount(cid) {
        const since = lastRead[cid] ?? 0;
        return (messages[cid] ?? []).filter(
          (m) => m.uid !== me?.uid && m.createdAt && m.createdAt > since,
        ).length;
      }
      function renderSide() {
        $("chanList").innerHTML = CHANNELS.map((c) => {
          const n = c.id === current ? 0 : unreadCount(c.id);
          return `<button class="item ${c.id === current ? "on" : ""} ${n ? "unread" : ""}" data-chan="${c.id}">
        <span class="hash">#</span>${esc(c.name)}${n ? `<span class="badge">${n > 99 ? "99+" : n}</span>` : ""}</button>`;
        }).join("");
        const list = Object.entries(users)
          .filter(([, u]) => u.name)
          .sort(
            ([a], [b]) =>
              isOnline(b) - isOnline(a) ||
              nameOf(a).localeCompare(nameOf(b), "ko"),
          );
        $("memberList").innerHTML = list
          .map(
            ([uid]) => `<div class="item member">
      <span class="dot ${isOnline(uid) ? "on" : ""}"></span>${esc(nameOf(uid))}${uid === me?.uid ? ' <span class="you">(나)</span>' : ""}</div>`,
          )
          .join("");
        const total = CHANNELS.reduce(
          (s, c) => s + (c.id === current ? 0 : unreadCount(c.id)),
          0,
        );
        document.title = (total ? `(${total}) ` : "") + BASE_TITLE;
      }
      $("chanList").addEventListener("click", (e) => {
        const b = e.target.closest("[data-chan]");
        if (!b) return;
        switchChannel(b.dataset.chan);
        document.body.classList.remove("nav");
      });
      $("menuBtn").addEventListener("click", () =>
        document.body.classList.toggle("nav"),
      );

      // ---- 메시지 목록 ----
      function renderMsgs(keepScroll) {
        const box = $("msgs");
        const atBottom =
          box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        const list = messages[current];
        if (!list) {
          box.innerHTML = '<div class="empty">불러오는 중…</div>';
          return;
        }
        const ch = CHANNELS.find((c) => c.id === current);
        if (!list.length) {
          box.innerHTML = `<div class="empty"><b>#${esc(ch.name)}</b> 채널의 첫 메시지를 남겨보세요 👋</div>`;
          return;
        }

        let html = "",
          prev = null,
          prevDay = "";
        for (const m of list) {
          const t = m.createdAt ?? now();
          const day = new Date(t).toDateString();
          if (day !== prevDay) {
            html += `<div class="day"><span>${fmtDay(t)}</span></div>`;
            prev = null;
            prevDay = day;
          }
          const cont =
            prev &&
            prev.uid === m.uid &&
            t - (prev.createdAt ?? now()) < 5 * 60_000;
          const reacts = Object.entries(m.reactions ?? {}).filter(
            ([, uids]) => uids.length,
          );
          const cls = [
            "msg",
            cont && "cont",
            !m.createdAt && "pending",
            m.uid !== me?.uid && mentionsMe(m.text) && "mention",
          ]
            .filter(Boolean)
            .join(" ");
          html += `<div class="${cls}" data-id="${m.id}">
        ${
          cont
            ? `<div class="gutter-time">${fmtTime(t)}</div>`
            : `<div class="av" style="background:${color(m.uid)}">${esc(nameOf(m.uid).slice(0, 1))}</div>`
        }
        <div>
          ${cont ? "" : `<div class="meta"><span class="who">${esc(nameOf(m.uid))}</span><span class="time">${fmtTime(t)}</span></div>`}
          <div class="text">${fmtText(m.text)}</div>
          ${
            reacts.length
              ? `<div class="reacts">${reacts
                  .map(
                    ([e, uids]) =>
                      `<button data-react="${e}" class="${uids.includes(me?.uid) ? "mine" : ""}" title="${esc(uids.map(nameOf).join(", "))}">${e} ${uids.length}</button>`,
                  )
                  .join("")}</div>`
              : ""
          }
        </div>
        <div class="tools"><button data-pick title="반응 추가">😀</button>${m.uid === me?.uid ? '<button data-del title="삭제">🗑️</button>' : ""}</div>
      </div>`;
          prev = m;
        }
        const oldTop = box.scrollTop;
        box.innerHTML = html;
        if (keepScroll && !atBottom) box.scrollTop = oldTop;
        else box.scrollTop = box.scrollHeight;
      }

      function markRead() {
        const list = messages[current] ?? [];
        const last = list.reduce(
          (mx, m) => Math.max(mx, m.createdAt ?? 0),
          lastRead[current] ?? 0,
        );
        lastRead[current] = last;
        localStorage.setItem("lastRead", JSON.stringify(lastRead));
      }

      function switchChannel(cid) {
        current = cid;
        localStorage.setItem("chan", cid);
        const ch = CHANNELS.find((c) => c.id === cid);
        $("chanTitle").textContent = "# " + ch.name;
        $("chanDesc").textContent = ch.desc;
        $("input").placeholder = `#${ch.name}에 메시지 보내기`;
        markRead();
        renderMsgs(false);
        renderSide();
        renderTyping();
        $("input").focus();
      }

      // ---- Firebase ----
      const [{ initializeApp }, auth, fs, { firebaseConfig }] =
        await Promise.all([
          import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"),
          import("./firebase-config.js"),
        ]);
      const app = initializeApp(firebaseConfig);
      const fbAuth = auth.getAuth(app);
      const db = fs.getFirestore(app);
      const msgCol = (cid) => fs.collection(db, "channels", cid, "messages");
      const tsMs = (ts) => ts?.toMillis?.() ?? null;

      // ---- 이름 ----
      const dlg = $("nameDlg");
      function showMe() {
        $("meName").textContent = me?.name ? me.name : "";
        $("renameBtn").hidden = !me;
      }
      function askName() {
        $("nameInput").value = me?.name ?? "";
        $("nameErr").textContent = "";
        dlg.showModal();
        $("nameInput").focus();
      }
      dlg.addEventListener("cancel", (e) => {
        if (!me?.name) e.preventDefault();
      });
      $("renameBtn").addEventListener("click", askName);
      $("nameForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("nameInput").value.trim();
        if (!name) {
          $("nameErr").textContent = "이름을 입력해 주세요.";
          return;
        }
        try {
          await fs.setDoc(
            fs.doc(db, "users", me.uid),
            { name, lastSeen: fs.serverTimestamp() },
            { merge: true },
          );
          me.name = name;
          dlg.close();
          showMe();
          enableInput();
        } catch (err) {
          $("nameErr").textContent = "저장 실패: " + err.code;
        }
      });

      // ---- 접속 상태 (heartbeat) ----
      function heartbeat() {
        if (!me?.name) return;
        fs.updateDoc(fs.doc(db, "users", me.uid), {
          lastSeen: fs.serverTimestamp(),
        }).catch(() => {});
      }
      setInterval(heartbeat, 30_000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          heartbeat();
          markRead();
          renderSide();
        }
      });
      setInterval(() => {
        renderSide();
        renderTyping();
      }, 5_000);

      // ---- 입력 중 표시 ----
      let lastTypingSent = 0;
      function sendTyping(on) {
        if (!me?.name) return;
        if (on && Date.now() - lastTypingSent < 3_000) return;
        lastTypingSent = on ? Date.now() : 0;
        fs.updateDoc(fs.doc(db, "users", me.uid), {
          typing: on ? { cid: current, at: fs.serverTimestamp() } : null,
        }).catch(() => {});
      }
      function renderTyping() {
        const who = Object.entries(users)
          .filter(
            ([uid, u]) =>
              uid !== me?.uid &&
              u.typing?.cid === current &&
              now() - (u.typing.at ?? 0) < TYPING_MS,
          )
          .map(([uid]) => nameOf(uid));
        $("typing").textContent = !who.length
          ? ""
          : who.length === 1
            ? `${who[0]} 님이 입력 중…`
            : `${who.join(", ")} 님이 입력 중…`;
      }

      // ---- 전송 ----
      const input = $("input");
      function enableInput() {
        input.disabled = false;
        updateSendBtn();
        input.focus();
      }
      function updateSendBtn() {
        $("sendBtn").disabled = !input.value.trim() || !me?.name;
      }
      function autoGrow() {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
      }
      input.addEventListener("input", () => {
        autoGrow();
        updateSendBtn();
        sendTyping(!!input.value.trim());
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          $("sendForm").requestSubmit();
        }
      });
      $("sendForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !me?.name) return;
        input.value = "";
        autoGrow();
        updateSendBtn();
        sendTyping(false);
        try {
          await fs.addDoc(msgCol(current), {
            uid: me.uid,
            text,
            createdAt: fs.serverTimestamp(),
            reactions: {},
          });
        } catch (err) {
          alert("전송 실패: " + err.code);
          input.value = text;
          autoGrow();
          updateSendBtn();
        }
      });

      // ---- 반응 / 삭제 ----
      let pop = null;
      function closePop() {
        pop?.remove();
        pop = null;
        document
          .querySelectorAll(".tools.open")
          .forEach((t) => t.classList.remove("open"));
      }
      function toggleReaction(mid, emoji) {
        const m = messages[current].find((x) => x.id === mid);
        const has = m?.reactions?.[emoji]?.includes(me.uid);
        fs.updateDoc(fs.doc(msgCol(current), mid), {
          [`reactions.${emoji}`]: has
            ? fs.arrayRemove(me.uid)
            : fs.arrayUnion(me.uid),
        }).catch((err) => alert("반응 실패: " + err.code));
      }
      $("msgs").addEventListener("click", (e) => {
        const row = e.target.closest(".msg");
        if (!row || !me?.name) return;
        const mid = row.dataset.id;
        const react = e.target.closest("[data-react]");
        if (react) return toggleReaction(mid, react.dataset.react);
        if (e.target.closest("[data-del]")) {
          if (confirm("이 메시지를 삭제할까요?"))
            fs.deleteDoc(fs.doc(msgCol(current), mid)).catch((err) =>
              alert("삭제 실패: " + err.code),
            );
          return;
        }
        const pick = e.target.closest("[data-pick]");
        if (pick) {
          e.stopPropagation();
          closePop();
          pick.parentElement.classList.add("open");
          pop = document.createElement("div");
          pop.className = "emoji-pop";
          pop.innerHTML = EMOJIS.map(
            (x) => `<button data-e="${x}">${x}</button>`,
          ).join("");
          document.body.append(pop);
          const r = pick.getBoundingClientRect();
          pop.style.top =
            Math.min(r.bottom + 4, innerHeight - pop.offsetHeight - 8) + "px";
          pop.style.left = Math.max(8, r.right - pop.offsetWidth) + "px";
          pop.addEventListener("click", (ev) => {
            const b = ev.target.closest("[data-e]");
            if (b) {
              toggleReaction(mid, b.dataset.e);
              closePop();
            }
          });
        }
      });
      document.addEventListener("click", (e) => {
        if (pop && !pop.contains(e.target)) closePop();
      });

      // ---- 로그인 & 실시간 구독 ----
      auth.onAuthStateChanged(fbAuth, async (user) => {
        if (!user) {
          auth.signInAnonymously(fbAuth).catch((err) => {
            $("meName").textContent = "접속 실패: " + err.code;
          });
          return;
        }
        const snap = await fs.getDoc(fs.doc(db, "users", user.uid));
        me = { uid: user.uid, name: snap.data()?.name ?? "" };
        showMe();
        if (me.name) {
          enableInput();
          heartbeat();
        } else askName();

        fs.onSnapshot(fs.collection(db, "users"), (qs) => {
          qs.docChanges().forEach((c) => {
            if (c.type === "removed") {
              delete users[c.doc.id];
              return;
            }
            const d = c.doc.data({ serverTimestamps: "estimate" });
            const lastSeen = tsMs(d.lastSeen) ?? 0;
            if (
              c.doc.id === me.uid &&
              !c.doc.metadata.hasPendingWrites &&
              lastSeen
            )
              skew = lastSeen - Date.now();
            users[c.doc.id] = {
              name: d.name,
              lastSeen,
              typing: d.typing
                ? { cid: d.typing.cid, at: tsMs(d.typing.at) }
                : null,
            };
          });
          renderSide();
          renderTyping();
          renderMsgs(true);
        });

        for (const ch of CHANNELS) {
          const q = fs.query(
            msgCol(ch.id),
            fs.orderBy("createdAt", "desc"),
            fs.limit(HISTORY),
          );
          fs.onSnapshot(q, (qs) => {
            messages[ch.id] = qs.docs
              .map((d) => {
                const x = d.data();
                return {
                  id: d.id,
                  uid: x.uid,
                  text: x.text,
                  createdAt: tsMs(x.createdAt),
                  reactions: x.reactions ?? {},
                };
              })
              .reverse();
            if (ch.id === current) {
              if (document.visibilityState === "visible") markRead();
              renderMsgs(true);
            }
            renderSide();
          });
        }
        switchChannel(current);
      });
    </script>
  </body>
</html>
